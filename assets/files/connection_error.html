<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 400px; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
        p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; }
        .retry-btn {
            display: inline-block;
            padding: 12px 32px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .retry-btn:active { background-color: #1976D2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#128268;</div>
        <h1>No Internet Connection</h1>
        <p>Please check your network connection and try again.</p>
        <button class="retry-btn" onclick="window.open('bttoa:dashboard');">Retry</button>
    </div>
</body>
</html>
